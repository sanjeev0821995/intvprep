<div class="absolute inset-0 flex flex-col min-w-0 overflow-y-auto" cdkScrollable>

    <!-- Header -->
    <div class="relative flex-0 py-8 px-4 mt-16 sm:p-16 sm:mt-16 overflow-hidden bg-gray-800 dark">
        <!-- Background - @formatter:off -->
        <!-- Rings -->
        <svg class="absolute inset-0 pointer-events-none" viewBox="0 0 960 540" width="100%" height="100%" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
            <g class="text-gray-700 opacity-25" fill="none" stroke="currentColor" stroke-width="100">
                <circle r="234" cx="196" cy="23"></circle>
                <circle r="234" cx="790" cy="491"></circle>
            </g>
        </svg>
        <!-- @formatter:on -->
        <div class="z-10 relative flex flex-col items-center">
            <img class="w-32" src="assets/images/logo/logo.svg" alt="image">
            <h2 class="text-xl font-semibold">Intvprep.</h2>
            <div class="mt-1 text-4xl sm:text-7xl font-extrabold tracking-tight leading-tight text-center">
                Are you preparing for the Interview?
            </div>
            <div class="max-w-2xl mt-6 sm:text-2xl text-center tracking-tight text-secondary">
                Our Questions Series will help you to land your dream JOB. We are Continuously Updating our Questions Series.
            </div>
        </div>
    </div>

    <!-- Main -->
    <div class="flex flex-auto p-6 sm:p-10">

        <div class="flex flex-col flex-auto w-full max-w-xs sm:max-w-5xl mx-auto">
            <!-- Courses -->
            <ng-container>
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8 mt-8 sm:mt-10">
                    <ng-container *ngFor="let course of getConfig">
                        <!-- Course -->
                        <div class="flex flex-col h-96 shadow rounded-2xl overflow-hidden bg-card">
                            <div class="flex flex-col p-6">
                                <div class="flex items-center justify-between">
                                    <!-- Course category -->
                                    <ng-container>
                                        <div class="py-0.5 px-3 rounded-full text-sm font-semibold text-green-800 bg-green-100 dark:text-green-50 dark:bg-green-500">
                                            {{course.category}}
                                        </div>
                                    </ng-container>
                                    <!-- Completed at least once -->
                                    <div class="flex items-center hover:transition duration-500 hover:scale-125" (click)="copyTheUrl(course.id)">
                                        <ng-container>
                                            <mat-icon class="icon-size-5 cursor-pointer text-green-600" [svgIcon]="'feather:share-2'" [matTooltip]="'Share with your friends...🤗'"></mat-icon>
                                        </ng-container>
                                    </div>
                                </div>
                                <!-- Course title & description -->
                                <div class="mt-4 text-lg font-medium">{{course.title}}</div>
                                <div class="mt-0.5 line-clamp-2 text-secondary">{{course.description}}</div>
                                <div class="w-12 h-1 my-6 border-t-2"></div>
                                <div>
                                    <img [src]="
                                                'assets/images/home/' +
                                                course.imgUrl +
                                                '.svg'
                                            " style='height:5rem;' alt="image" />
                                </div>
                            </div>
                            <!-- Footer -->
                            <div class="flex flex-col w-full mt-auto">
                                <!-- Course progress -->
                                <!-- <div class="relative h-0.5">
                                    <div class="z-10 absolute inset-x-0 h-6 -mt-3" [matTooltip]="course.progress.currentStep / course.totalSteps | percent" [matTooltipPosition]="'above'" [matTooltipClass]="'-mb-0.5'"></div>
                                    <mat-progress-bar class="h-0.5" [value]="(100 * course.progress.currentStep) / course.totalSteps"></mat-progress-bar>
                                </div> -->

                                <!-- Course launch button -->
                                <div class="px-6 py-4 text-right bg-gray-50 dark:bg-transparent">
                                    <button mat-stroked-button [routerLink]="[course.id]">
                                        <span class="inline-flex items-center">
                                            <!-- Started -->
                                            <ng-container >
                                                <span>{{course.buttonName}}</span>
                                            </ng-container>

                                            <mat-icon
                                                class="ml-1.5 icon-size-5"
                                                [svgIcon]="'heroicons_solid:arrow-sm-right'"></mat-icon>
                                        </span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </ng-container>
                </div>
            </ng-container>
        </div>

    </div>

</div>

<fuse-alert [type]="'success'" [appearance]="'outline'" *ngIf="showAlert">
    <span fuseAlertTitle>URL copied  📎 successfully...! </span> Help your friends by sharing it...🤝
</fuse-alert>
