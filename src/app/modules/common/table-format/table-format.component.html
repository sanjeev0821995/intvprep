<div class="overflow-x-auto relative mx-2 sm:mx-2 mt-6 mb-4">
    <table class="w-full text-sm text-left text-black dark:text-gray-400">
        <thead class="text-xs text-gray-700 uppercase bg-gray-50 dark:bg-gray-700 dark:text-gray-400">
            <tr>
                <th scope="col" class="py-3 px-6 text-lg" *ngFor="let row of config.header">{{row.label}}</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let row of config.column" class="bg-white border-b dark:bg-gray-800 dark:border-gray-700">
                <td class="py-4 px-6 text-lg" *ngFor="let row of row.row">{{row.col}}</td>
            </tr>
        </tbody>
    </table>
</div>
